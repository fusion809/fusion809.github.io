name: Build and Deploy
on:
  push:
    branches:
      - dev
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        persist-credentials: false
    # NOTE: Python is necessary for the pre-rendering (minification) step
    - name: Install python
      uses: actions/setup-python@v2
      with:
        python-version: '3.15'
    # NOTE: Here you can install dependencies such as matplotlib if you use
    # packages such as PyPlot.
    - run: pip install matplotlib
    # GLMakie needs an X11 display even when it renders offscreen.
    - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
    - name: Install Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: 1
    # NOTE
    #   The steps below ensure that NodeJS and Franklin are loaded then it
    #   installs highlight.js which is needed for the prerendering step
    #   (code highlighting + katex prerendering).
    #   Then the environment is activated and instantiated to install all
    #   Julia packages which may be required to successfully build your site.
    #   The last line should be `optimize()` though you may want to give it
    #   specific arguments, see the documentation or ?optimize in the REPL.
    - run: |
        xvfb-run -a julia -e '
        using Pkg
        Pkg.activate(".")
        include(".github/scripts/install_julia_dependencies.jl")
        install_scanned_julia_dependencies()
        Pkg.add(Pkg.PackageSpec(name="NodeJS"))
        using NodeJS
        run(`$(npm_cmd()) install highlight.js`)
        using Franklin
        Pkg.instantiate()
        using DifferentialEquations, Plots, LaTeXStrings

        gif_scripts = Tuple{String,String}[]
        for (root, dirs, files) in walkdir(".")
            filter!(dir -> !(dir in [".git", "__site", "node_modules"]), dirs)
            for name in files
                endswith(name, ".md") || continue
                md_file = joinpath(root, name)
                content = read(md_file, String)
                for source_match in eachmatch(r"fidello/code/[^\s{}]+\.jl", content)
                    source_file = source_match.match
                    isfile(source_file) || continue
                    code_text = read(source_file, String)
                    occursin(r"(?i)\bgif\s*\(|\.gif\b", code_text) || continue
                    push!(gif_scripts, (md_file, source_file))
                end
            end
        end
        sort!(unique!(gif_scripts))
        isempty(gif_scripts) && error("No GIF-generating Julia listings found in Markdown files")
        foreach(gif_scripts) do script
            md_file, source_file = script
            include_string(Main, read(source_file, String), md_file)
        end
        include("deploy.jl")'
      env:
          # Allows the use of unicode characters in Plots.jl
          GKS_ENCODING: "utf8"
          # Fixes 'GKS: can't connect to GKS socket application' errors
          # and quality of output plots in GR back end.
          GKSwstype: "100"
    - name: Verify Fidello page was generated
      run: test -s __site/fidello/index.html
    - name: Finalize and verify reference lists
      run: julia --project=. finalize_references.jl
    - name: Include generated GIFs in site
      run: find . -maxdepth 1 -type f -iname '*.gif' -exec cp -t __site/ {} +
    - name: Build and Deploy
      uses: JamesIves/github-pages-deploy-action@releases/v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: __site


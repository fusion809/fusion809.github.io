name: Build and Deploy
on:
  push:
    branches:
      - dev
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        persist-credentials: false
    # NOTE: Python is necessary for the pre-rendering (minification) step
    - name: Install python
      uses: actions/setup-python@v2
      with:
        python-version: '3.15'
    # NOTE: Here you can install dependencies such as matplotlib if you use
    # packages such as PyPlot.
    - run: pip install matplotlib
    - name: Install Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: 1
    # NOTE
    #   The steps below ensure that NodeJS and Franklin are loaded then it
    #   installs highlight.js which is needed for the prerendering step
    #   (code highlighting + katex prerendering).
    #   Then the environment is activated and instantiated to install all
    #   Julia packages which may be required to successfully build your site.
    #   The last line should be `optimize()` though you may want to give it
    #   specific arguments, see the documentation or ?optimize in the REPL.
    - run: julia -e '
            using Pkg; Pkg.activate("."); Pkg.add([Pkg.PackageSpec(url="https://github.com/fusion809/FunctionIntegrator.jl", rev="v0.6.1"), Pkg.PackageSpec(name="NodeJS"), Pkg.PackageSpec(name="Franklin"), Pkg.PackageSpec(name="PyPlot"), Pkg.PackageSpec(name="Interpolations"), Pkg.PackageSpec(name="DataFrames"), Pkg.PackageSpec(name="StaticArrays"), Pkg.PackageSpec(name="FFTW"), Pkg.PackageSpec(name="Plots"), Pkg.PackageSpec(name="GLMakie"),Pkg.PackageSpec(name="Colors"), Pkg.PackageSpec(name="Measures"), Pkg.PackageSpec(name="DifferentialEquations"), Pkg.PackageSpec(name="Printf"), Pkg.PackageSpec(name="LaTeXStrings"), Pkg.PackageSpec(name="PlotlyJS")]);
            using NodeJS; run(`$(npm_cmd()) install highlight.js`);
            using Franklin;
            Pkg.instantiate();
            using DifferentialEquations, Plots, LaTeXStrings;
            foreach(file -> begin
                content = read(file, String);
                listing = match(r"\\codelisting\{[^}]*\}\{[^}]*\}\{[^}]*\}\{([^}]+)\}", content);
                isnothing(listing) && error("No four-argument Julia code listing found in $file");
                code_text = read(strip(listing.captures[1]), String);
                occursin(r"gif\s*\(", code_text) || error("No GIF generation code found in $file");
                include_string(Main, code_text, file);
            end, ["fidello/_01-introduction.md", "fidello/_03fii-wo-air-resistance.md", "fidello/_03h-three-body-problem.md", "fidello/_03i-n-body-problem.md", "fidello/_03fiii-w-air-resistance.md", "fidello/_04biii-projectile-motion.md"]);
            include("deploy.jl")'
      env:
          # Allows the use of unicode characters in Plots.jl
          GKS_ENCODING: "utf8"
          # Fixes 'GKS: can't connect to GKS socket application' errors
          # and quality of output plots in GR back end.
          GKSwstype: "100"
    - name: Include generated GIFs in site
      run: find . -maxdepth 1 -type f -iname '*.gif' -exec cp -t __site/ {} +
    - name: Build and Deploy
      uses: JamesIves/github-pages-deploy-action@releases/v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: __site


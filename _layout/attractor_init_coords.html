<tr>
                    <td><label for="t0">\(t_0\):</label></td>
                    <td><input type="Number"
                        id="t0"
                        name="t0"
                        value="{{t0}}"></td>
                    <td>Starting time for the simulation in seconds (s).</td>
                </tr>     
                <tr>
                    <td><label for="tf">\(t_f\):</label></td>
                    <td><input type="Number"
                        id="tf"
                        name="tf"
                        value="{{ tf }}"></td>
                    <td>End time for the simulation in seconds.</td>
                </tr>
                <tr>
                    <td><label for="{{ var1}}0">\({{var1}}_0\):</label></td>
                    <td><input type="Number"
                        id="{{var1}}0"
                        name="{{var1}}0"
                        value="{{ var1_value }}"></td>
                    <td>Value of \({{var1}}\) at \(t_0\).</td>
                </tr>

                    <td><label for="{{var2}}0">\({{var2}}_0\):</label></td>

                        id="{{var2}}0"

                        value="{{ var2_value }}"></td>
                    <td>Value of \({{var2}}\) at \(t_0\).</td>
                </tr>

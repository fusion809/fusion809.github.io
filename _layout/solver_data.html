<tr>
                    <td><label for="epsilon">\(\epsilon\):</label></td>
                    <td><input type="Number"
                       id="epsilon"
                       name="epsilon"
                       value="1e-9"></td>
                    <td>Absolute error tolerance. Too small of error tolerance can cause the solver to error.</td>
                </tr>
                <tr>
                    <td><label for="hInitial">hInitial:</label></td>
                    <td><input type="Number"
                        id="hInitial"
                        name="hInitial"
                        value="0.1"></td>
                    <td>Initial guess for step size.</td>
                </tr>
                <tr>
                    <td><label for="hMin">hMin:</label></td>
                    <td><input type="Number"
                        id="hMin"
                        name="hMin"
                        value="1e-8"></td>
                    <td>Minimum limit for step size.</td>
                </tr>
                <tr>
                    <td><label for="Deltat">\(\Delta t\)</label></td>
                    <td><input type="Number"
                        id="Deltat"
                        name="Deltat"
                        value="20"></td>
                    <td>Time for skipping ahead in animation.</td>
                </tr>
                <tr>
                    <td><label for="skipTime">\(t_1\)</label></td>
                    <td><input type="Number"
                        id="skipTime"
                        name="skipTime"
                        value="50"></td>
                    <td>Time you want to skip ahead to in the animation.</td>
                </tr>
